<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>
<body>
    // Se verá cuando entre en la página
    <h1>Has conseguido entrar en la página</h1>
    <script>
        let apellido = "Suárez";
        let mensaje = prompt("Introduce el primer apellido del primer presidente español de la democracia para acceder a la página")
        // Hasta que no escriba el apellido correctamente no entrará en la página
        while (mensaje !== apellido) {
            mensaje = prompt("Error en el apellido, vuelve a introducirlo")
        }
    </script>
</body>
</html>
