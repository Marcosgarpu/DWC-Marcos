<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relacion 3</title>
    <script src="T1R3.js"></script>
</head>

<body>
    <script>
        let resultadoArea = 0;
        let resultadoLongitud = 0;
        radio = parseInt(prompt("Introduce el radio del circulo en centímetros."));
        
        resultadoArea = circumference(radio);
        resultadoLongitud = area(radio);

        document.write("El área del circulo es " + resultadoArea + "cm2");
        document.write("La longitud de la circunferancia es " + resultadoArea + "cm2");
    </script>
</body>

</html>
