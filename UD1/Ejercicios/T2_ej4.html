<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
</head>
<body>
    <script>
        for (let hora = 9; hora <= 21; hora++) {
            // Muestro hora en punto
            document.write(`<p>${hora}:00</p>`);
            // Muestro la hora y media
            document.write(`<p>${hora}:30</p>`);
        }
    </script>
</body>
</html>
