<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>
    <script>
        for (var tabla = 1; tabla <= 10; tabla++) {
            document.write('<p><b>Tabla del ' + tabla + ':</b><br>');
            for (var i = 1; i <= 10; i++) {
                document.write(i + 'x' + tabla + '=' + (i * tabla) + '<br>');
            }
            document.write('</p>');
        }
    </script>
</body>

</html>
