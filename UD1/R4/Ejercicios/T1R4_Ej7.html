<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7</title>
</head>

<body>
    <script>
        function divisibleEntre(numero, divisor) {
            return numero % divisor === 0;
        }

        var numero = parseInt(prompt("Introduce un número:"));
        var divisor = parseInt(prompt("Introduce el divisor:"));
        document.write(numero + " es divisible entre " + divisor + ": " + divisibleEntre(numero, divisor));
    </script>
</body>

</html>
