<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 10</title>
</head>

<body>
    <script>
        function areaRectangulo(lado1, lado2) {
            return lado1 * lado2;
        }

        var lado1 = parseFloat(prompt("Introduce el primer lado del rectángulo:"));
        var lado2 = parseFloat(prompt("Introduce el segundo lado del rectángulo:"));
        document.write("El área del rectángulo es: " + areaRectangulo(lado1, lado2));
    </script>
</body>

</html>
