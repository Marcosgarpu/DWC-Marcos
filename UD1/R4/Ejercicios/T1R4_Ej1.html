<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>

<body>
    <script>
        function sum(...numeros) {
            return numeros.reduce((total, n) => total + n, 0);
        }

        document.write("Suma: " + sum(1, 2, 3, 4));
    </script>
</body>

</html>
