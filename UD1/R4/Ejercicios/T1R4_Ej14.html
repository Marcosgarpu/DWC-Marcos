<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14</title>
</head>

<body>
    <script>
        function divisible(dividendo, divisor) {
            return dividendo % divisor === 0;
        }

        var dividendo = parseInt(prompt("Introduce el dividendo:"));
        var divisor = parseInt(prompt("Introduce el divisor:"));
        document.write(dividendo + " es divisible entre " + divisor + ": " + divisible(dividendo, divisor));
    </script>
</body>

</html>
