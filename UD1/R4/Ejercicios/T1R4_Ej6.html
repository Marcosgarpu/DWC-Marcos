<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>
    <script>
        function divisible(numero) {
            return numero % 3 === 0;
        }

        var numero = parseInt(prompt("Introduce un número para comprobar si es divisible entre 3:"));
        document.write(numero + " es divisible entre 3: " + divisible(numero));
    </script>
</body>

</html>
