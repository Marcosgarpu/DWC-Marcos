<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12</title>
</head>

<body>
    <script>
        function precioFinal(precioOriginal, descuento) {
            return precioOriginal - (precioOriginal * (descuento / 100));
        }

        var precio = parseFloat(prompt("Introduce el precio original:"));
        var descuento = parseFloat(prompt("Introduce el descuento (%):"));
        document.write("El precio final es: " + precioFinal(precio, descuento));
    </script>
</body>

</html>
