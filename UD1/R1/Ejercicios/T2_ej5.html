<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        var countdown = prompt("Introduce un número para iniciar la cuenta atrás");
        while (countdown > 0) {
            alert(countdown + ".... ");
            countdown--; // Si fuera countdown++ entonces no sería una marcha atrás estaría contando los números de después del número introducido hasta que se pare el programa.
        }
    </script>
</body>
</html>
