<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>
<body>
    // Mensaje para saber que la cuenta atrás a finalizado.
    <h1>Cuenta atras finalizada</h1>
    <script>
        var countdown = prompt("Introduce un número para iniciar la cuenta atrás");
        // Bucle for que comienza desde el número introducido hasta que llegue a 0
        for (countdown; countdown >= 0 ; countdown--) {
            alert(countdown + "... ")
        }
    </script>
</body>
</html>
