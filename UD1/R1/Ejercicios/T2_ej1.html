<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1</title>
</head>
<body>
    <script>
        // Opreacion 1 y salida
        let opc1 = (20 == 20);
        document.write(`<p> La operación 20==20 es ${opc1} </p>`);
        
        // Operacion 2 y salida
        let opc2 = (20===20);
        document.write(`<p> La operación 20===20 es ${opc2} </p>`);

        // Operacion 3 y salida
        let opc3 = (20 === 20.0);
        document.write(`<p> La operación 20===20.0 es ${opc3} </p>`);

        // Operacion 4 y salida
        let opc4 = ("Juan" == "juan")
        document.write(`<p> La operación "Juan" == "juan" es ${opc4} </p>`);

        // Operacion 5 y salida
        let opc5 = ("Juan" > "juan");
        document.write(`<p> La operación "Juan" > "juan" es ${opc5} </p>`);

        // Operacion 6 y salida
        let opc6 = ("Juan" < "juan");
        document.write(`<p> La operación "Juan" < "juan" es ${opc6} </p>`);

        // Operacion 7 y salida
        document.write(`<p> La operación "123" == 123 es ${"123" == "123"} </p>`);

        // Operacion 8 y salida
        document.write(`<p> La operación "123" === 123 es ${"123" == "123"} </p>`);

        // Operacion 9 y salida
        document.write(`<p> La operación "123" == 123 es ${parseInt("123") == "123"} </p>`);

    </script>
</body>
</html>
