<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        // Creando variable que controlara la edad introducida como numero
        let edad = parseInt(prompt("Introduce tu edad: "));
        document.write(`${edad >= 18? "Eres mayor de edad": "Eres menor de edad"}`)
    </script>
</body>
