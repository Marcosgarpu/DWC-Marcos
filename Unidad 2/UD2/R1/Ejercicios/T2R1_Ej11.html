<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>
<body>
    <script>
var frase = prompt("Introduce una frase:");
var invertida = "";

for (var i = frase.length - 1; i >= 0; i--) {
    invertida += frase[i];
}

document.write("Frase original: " + frase + "<br>");
document.write("Frase invertida: " + invertida);
</script>
</body>
</html>
