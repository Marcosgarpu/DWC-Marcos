<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>
    <script>
        var nombre = prompt("Introduce tu nombre:");
        var apellido1 = prompt("Introduce tu primer apellido:");
        var apellido2 = prompt("Introduce tu segundo apellido:");

        var nombreCompleto = nombre + " " + apellido1 + " " + apellido2;

        console.log("Tamaño del nombre completo: " + nombreCompleto.length);
        console.log("En minúsculas: " + nombreCompleto.toLowerCase());
        console.log("En mayúsculas: " + nombreCompleto.toUpperCase());
        console.log("Nombre: " + nombre);
        console.log("Apellido 1: " + apellido1);
        console.log("Apellido 2: " + apellido2);

        document.write("Revisa la consola de depuración del navegador para ver los resultados.");
    </script>
</body>

</html>
