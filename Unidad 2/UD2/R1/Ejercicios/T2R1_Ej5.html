<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>

<body>
    <script>
        var opcion = parseInt(prompt("Introduce una opción:\n1. Potencia\n2. Raíz\n3. Redondeo\n4. Trigonometría"));

        switch (opcion) {
            case 1:
                var base = parseFloat(prompt("Introduce la base:"));
                var exponente = parseFloat(prompt("Introduce el exponente:"));
                document.write("La potencia de " + base + " elevado a " + exponente + " es: " + Math.pow(base, exponente));
                break;

            case 2:
                var numero = parseFloat(prompt("Introduce un número (no negativo):"));
                document.write("La raíz de " + numero + " es: " + Math.sqrt(numero));
                break;

            case 3:
                var decimal = parseFloat(prompt("Introduce un número decimal:"));
                document.write("Redondeo al entero más próximo: " + Math.round(decimal) + "<br>");
                document.write("Redondeo al alza: " + Math.ceil(decimal) + "<br>");
                document.write("Redondeo a la baja: " + Math.floor(decimal));
                break;

            case 4:
                var angulo = parseFloat(prompt("Introduce un ángulo (entre 0º y 360º):"));
                var radianes = angulo * Math.PI / 180;
                document.write("Seno: " + Math.sin(radianes) + "<br>");
                document.write("Coseno: " + Math.cos(radianes) + "<br>");
                document.write("Tangente: " + Math.tan(radianes));
                break;

            default:
                document.write("Opción no válida.");
        }
    </script>
</body>

</html>
