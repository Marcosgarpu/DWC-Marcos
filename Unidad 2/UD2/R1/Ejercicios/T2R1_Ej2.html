<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>

<body>
    <script>
        var cumpleStr = prompt("Introduce tu cumpleaños (YYYY-MM-DD):");
        var partes = cumpleStr.split("-");
        var anio = parseInt(partes[0]);
        var mes = parseInt(partes[1]) - 1; // los meses en Date van de 0 a 11
        var dia = parseInt(partes[2]);

        for (var y = anio; y <= 2100; y++) {
            var fecha = new Date(y, mes, dia);
            if (fecha.getDay() === 0) { // 0 = domingo
                console.log("En el año " + y + " tu cumpleaños cae en domingo.");
            }
        }

        document.write("Revisa la consola de depuración del navegador para ver los resultados.");
    </script>
</body>

</html>
