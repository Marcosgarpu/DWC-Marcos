<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 7 - Formulario de contacto</title>
    <style>
        body { font-family: Arial, sans-serif; }
        form { width: 350px; }
        label, input, textarea { display: block; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        input[type="submit"], input[type="reset"] { display: inline-block; width: auto; }
        #ayuda { color: #2c3e50; background-color: #fff3cd; padding: 8px;
                 min-height: 20px; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Contacto</h1>

    <form id="formulario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre">

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo">

        <label for="comentario">Comentario</label>
        <textarea id="comentario" rows="5"></textarea>

        <input type="submit" id="enviar" value="Enviar">
        <input type="reset" id="resetear" value="Resetear">
    </form>

    <div id="ayuda"></div>

    <script src="main.js"></script>
</body>
</html>
