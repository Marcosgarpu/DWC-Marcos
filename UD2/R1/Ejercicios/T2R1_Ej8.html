<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <script>
        var frase = prompt("Introduce una frase:");
        var contador = 0;

        for (var i = 0; i < frase.length; i++) {
            if (frase[i].toLowerCase() === "a") {
                contador++;
            }
        }

        document.write("La letra 'a' aparece " + contador + " veces.");
    </script>
</body>

</html>
