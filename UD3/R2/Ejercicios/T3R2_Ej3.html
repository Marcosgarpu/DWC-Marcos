<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>T4_EJ3</title>
</head>
<body>
<script>
    let aleatorios = [];
    let N = parseInt(prompt("Introduce N (cantidad de números a generar):"));

    for (let i = 0; i < N; i++) {
        // Números enteros entre 0 y 100
        aleatorios.push(Math.floor(Math.random() * 101));
    }

    document.write("<h2>Se han generado " + N + " números al azar:</h2>");
    document.write("<p>" + aleatorios.join(", ") + "</p>");
</script>
</body>
</html>
