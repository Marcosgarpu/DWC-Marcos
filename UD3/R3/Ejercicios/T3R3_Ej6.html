<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>EJ6 Vendedores</title>
  </head>
  <body>
    <h2>Alta de vendedores</h2>
    Nombre: <input type="text" id="nombre" /> Ventas brutas de la semana ($):
    <input type="number" id="ventas" min="0" step="0.01" />
    <button onclick="altaVendedor()">Dar de alta</button>

    <h3>Sueldos de la semana</h3>
    <div id="tabla"></div>

    <script>
      const vendedores = [];
      const ventas = [];

      // 200 $ fijos + 9 % de las ventas brutas
      function calcularSueldo(ventasBrutas) {
        return 200 + ventasBrutas * 0.09;
      }

      function altaVendedor() {
        const nombre = document.getElementById("nombre").value.trim();
        const importe = parseFloat(document.getElementById("ventas").value);

        if (nombre === "" || isNaN(importe) || importe < 0) {
          alert("Introduce un nombre y unas ventas válidas.");
          return;
        }

        vendedores.push(nombre);
        ventas.push(importe);

        document.getElementById("nombre").value = "";
        document.getElementById("ventas").value = "";

        mostrarTabla();
      }

      function mostrarTabla() {
        let html = "<table border='1' cellpadding='5'>";
        html +=
          "<tr><th>Vendedor</th><th>Ventas brutas</th><th>Sueldo final</th></tr>";
        for (let i = 0; i < vendedores.length; i++) {
          html +=
            "<tr><td>" +
            vendedores[i] +
            "</td><td>$ " +
            ventas[i].toFixed(2) +
            "</td><td>$ " +
            calcularSueldo(ventas[i]).toFixed(2) +
            "</td></tr>";
        }
        html += "</table>";
        document.getElementById("tabla").innerHTML = html;
      }
    </script>
  </body>
</html>
