<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>EJ11 Ventas del mes</title>
  </head>
  <body>
    <script>
      // Estadillos del mes: [nº vendedor (1-4), nº producto (1-5), valor total vendido]
      const estadillos = [
        [1, 1, 120],
        [1, 3, 80],
        [1, 5, 45],
        [2, 2, 200],
        [2, 1, 60],
        [2, 4, 150],
        [3, 5, 90],
        [3, 3, 110],
        [3, 2, 75],
        [4, 4, 300],
        [4, 1, 40],
        [4, 5, 130],
        [1, 1, 100],
        [2, 2, 50],
        [3, 3, 60],
        [4, 4, 220],
        [1, 2, 35],
        [2, 5, 85],
      ];

      // Matriz: filas = productos (5), columnas = vendedores (4)
      const ventas = [];
      for (let p = 0; p < 5; p++) {
        ventas[p] = [];
        for (let v = 0; v < 4; v++) {
          ventas[p][v] = 0;
        }
      }

      // Acumular cada estadillo en su vendedor y producto
      for (let i = 0; i < estadillos.length; i++) {
        const vendedor = estadillos[i][0];
        const producto = estadillos[i][1];
        const valor = estadillos[i][2];
        ventas[producto - 1][vendedor - 1] += valor;
      }

      // Totales por vendedor (última fila)
      const totalVendedor = [0, 0, 0, 0];
      let totalGeneral = 0;

      document.write("<h2>Ventas del último mes</h2>");
      document.write("<table border='1' cellpadding='5'>");

      // Cabecera
      document.write("<tr><th>Producto</th>");
      for (let v = 1; v <= 4; v++) {
        document.write("<th>Vendedor " + v + "</th>");
      }
      document.write("<th>Total producto</th></tr>");

      // Filas de productos, con total por producto en la última columna
      for (let p = 0; p < 5; p++) {
        let totalProducto = 0;
        document.write("<tr><th>Producto " + (p + 1) + "</th>");
        for (let v = 0; v < 4; v++) {
          document.write("<td>" + ventas[p][v] + "</td>");
          totalProducto += ventas[p][v];
          totalVendedor[v] += ventas[p][v];
        }
        document.write("<td><b>" + totalProducto + "</b></td></tr>");
        totalGeneral += totalProducto;
      }

      // Última fila: total por vendedor
      document.write("<tr><th>Total vendedor</th>");
      for (let v = 0; v < 4; v++) {
        document.write("<td><b>" + totalVendedor[v] + "</b></td>");
      }
      document.write("<td><b>" + totalGeneral + "</b></td></tr>");

      document.write("</table>");
    </script>
  </body>
</html>
